<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help - Tutor Inteligente</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            background-color: #1e293b;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .chat-header {
            padding: 15px;
            background-color: #0f172a;
            border-bottom: 1px solid #334155;
            text-align: center;
        }

        .chat-header h1 {
            font-size: 1.2rem;
            color: #38bdf8;
        }

        .chat-header p {
            font-size: 0.8rem;
            color: #94a3b8;
        }

        /* Área de configuração da Chave API */
        .api-key-container {
            padding: 10px 15px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            gap: 8px;
        }

        .api-key-container input {
            flex: 1;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #ffffff;
            font-size: 0.85rem;
            outline: none;
        }

        .api-key-container button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.4;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .bot-message {
            background-color: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-message {
            background-color: #0284c7;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            padding: 12px;
            background-color: #0f172a;
            display: flex;
            gap: 8px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #ffffff;
            outline: none;
            font-size: 0.95rem;
        }

        .chat-input-area input:focus {
            border-color: #38bdf8;
        }

        .chat-input-area button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .chat-input-area button:active {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <h1>🎓 Help - Tutor Inteligente</h1>
            <p>Seu professor particular que te ensina a pensar</p>
        </div>

        <!-- Área onde você digita e salva a sua Chave de API -->
        <div class="api-key-container">
            <input type="password" id="apiKeyInput" placeholder="Cole sua Chave de API aqui...">
            <button type="button" onclick="saveApiKey()">Salvar</button>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <strong>Help:</strong> Olá! Eu sou o Help. Qual dúvida vamos resolver juntos hoje?
            </div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Digite sua dúvida aqui..." onkeypress="handleKeyPress(event)">
            <button type="button" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // Histórico de mensagens para a IA lembrar da conversa
        const chatHistory = [];

        // Carrega a chave salva automaticamente ao abrir a página
        window.onload = function() {
            const savedKey = localStorage.getItem('user_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        // Função para salvar a chave no navegador
        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('user_api_key', key);
                alert('Chave de API salva com sucesso!');
            } else {
                alert('Por favor, digite uma chave válida.');
            }
        }

        async function sendMessage() {
            const inputElement = document.getElementById('userInput');
            const messageText = inputElement.value.trim();

            if (!messageText) return;

            // Pega a chave salva no navegador
            const apiKey = localStorage.getItem('user_api_key');

            if (!apiKey) {
                alert('Por favor, insira e salve sua Chave de API no campo superior antes de enviar uma mensagem.');
                return;
            }

            inputElement.value = '';
            
            // Exibe a mensagem do usuário
            appendMessage(messageText, 'user-message');

            chatHistory.push({
                role: 'user',
                parts: [{ text: messageText }]
            });

            const loadingId = appendMessage("Help está pensando...", 'bot-message');

            try {
                // Monta o prompt socrático combinando as instruções do sistema com o histórico
                const systemInstruction = "Você é o Help, um tutor educacional socrático amigável para estudantes. Sua missão é ensinar o aluno a pensar por conta própria. Nunca dê a resposta pronta de imediato; faça perguntas orientadoras, dê pistas e incentive o raciocínio crítico.";

                // Chamada direta para a API do Google Gemini via fetch
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        system_instruction: {
                            parts: [{ text: systemInstruction }]
                        },
                        contents: chatHistory
                    })
                });

                const data = await response.json();

                if (data.error) {
                    document.getElementById(loadingId).innerText = "Erro da API: " + (data.error.message || JSON.stringify(data.error));
                    return;
                }

                if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    
                    document.getElementById(loadingId).innerText = botReply;

                    chatHistory.push({
                        role: 'model',
                        parts: [{ text: botReply }]
                    });
                } else {
                    document.getElementById(loadingId).innerText = "Não foi possível gerar uma resposta.";
                }

            } catch (error) {
                console.error("Erro na requisição:", error);
                document.getElementById(loadingId).innerText = "Erro ao conectar com a API.";
            }
        }

        function appendMessage(text, className) {
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            const uniqueId = 'msg-' + Date.now();
            
            messageElement.id = uniqueId;
            messageElement.classList.add('message', className);
            messageElement.innerText = text;

            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return uniqueId;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
