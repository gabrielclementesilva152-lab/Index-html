<script>
    // Cole aqui a sua chave (mesmo que comece com AQ...)
    const API_KEY = "AQ.Ab8RN6LXf1kDbtWxqkon2gpAkiaCw2L0l1rHlq4r8_OGpZh0eQ"; 

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const messageText = inputField.value.trim();

        if (messageText === "") return;

        appendMessage(messageText, 'user-message');
        inputField.value = '';

        const loadingId = appendMessage("Help está pensando...", 'bot-message');

        try {
            // Chamada direta usando o parâmetro de chave aceito pelo projeto
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `Você é o Help, um tutor escolar. Responda em português. JAMAIS dê respostas prontas. Faça perguntas guiadas para ajudar o aluno a descobrir sozinho.\n\nDúvida do aluno: ${messageText}`
                        }]
                    }]
                })
            });

            const data = await response.json();
            
            if (data.error) {
                // Se a chave do Cloud falhar, o sistema exibe o motivo detalhado
                document.getElementById(loadingId).innerText = "Erro na resposta: " + data.error.message;
                return;
            }

            const botReply = data.candidates[0].content.parts[0].text;
            document.getElementById(loadingId).innerText = botReply;

        } catch (error) {
            document.getElementById(loadingId).innerText = "Erro ao conectar com o servidor.";
        }
    }

    function appendMessage(text, className) {
        const chatMessages = document.getElementById('chatMessages');
        const messageElement = document.createElement('div');
        const uniqueId = 'msg-' + Date.now();
        
        messageElement.id = uniqueId;
        messageElement.classList.add('message', className);
        messageElement.innerText = text;

        chatMessages.appendChild(messageElement);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        return uniqueId;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>
